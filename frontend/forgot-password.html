<!-- frontend/forgot-password.html -->
<!DOCTYPE html>
<html lang="vi" data-lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 38'%3E%3Crect width='38' height='38' rx='8' fill='%23b43e12'/%3E%3Cpath d='M10 14 L14 10 L24 10 L28 14 L26 14 L26 28 L12 28 L12 14 Z' fill='%23f6f3ec' opacity='0.92'/%3E%3Cpath d='M16 10 L19 6 L22 10' stroke='%23f6f3ec' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#b43e12">
  <title>Quên mật khẩu — Blankup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page-body">

  <header class="login-header">
    <div class="container">
      <a href="/" class="navbar-logo">
        <svg class="logo-icon" viewBox="0 0 38 38" fill="none">
          <rect width="38" height="38" rx="4" fill="#b43e12"/>
          <path d="M10 14 L14 10 L24 10 L28 14 L26 14 L26 28 L12 28 L12 14 Z" fill="white" opacity="0.92"/>
          <path d="M16 10 L19 6 L22 10" stroke="white" stroke-width="1.5" fill="none"/>
        </svg>
        <span>BLANK<span class="logo-highlight">UP</span></span>
      </a>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card animate-fade-in">
      <div class="login-card-header">
        <div class="tag" style="margin-bottom: 18px;"><span>Khôi phục tài khoản</span></div>
        <h2>Quên mật khẩu?</h2>
        <p>Nhập tên đăng nhập hoặc email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
      </div>

      <form id="forgotForm">
        <div class="form-group">
          <label>Tên đăng nhập hoặc email</label>
          <input type="text" class="form-input" id="identifierInput" placeholder="username hoặc email@example.com" required>
        </div>

        <div class="auth-error" id="forgotErrorMsg" style="display: none;"></div>
        <div id="forgotSuccessMsg" style="display: none; font-size: 0.86rem; color: var(--success); background: rgba(74,90,63,0.08); border: 1px solid rgba(74,90,63,0.25); border-radius: var(--radius-xs); padding: 12px 14px; margin-bottom: 18px;"></div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 4px;" id="forgotSubmitBtn">
          <span>Gửi link đặt lại mật khẩu</span>
        </button>
      </form>

      <div class="return-home">
        <a href="/login.html" class="btn-back">← Quay lại Đăng nhập</a>
      </div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
